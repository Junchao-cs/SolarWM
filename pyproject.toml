[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solar"
version = "0.1.0"
description = "A reproducible multi-backbone framework for interactive video world models."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "SolarWM Contributors"}]
dependencies = [
  "numpy>=1.24",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
train = [
  "torch>=2.5",
  "safetensors>=0.4",
  "einops>=0.8",
  "decord>=0.6",
]
wan = [
  # Matches the release-tested Wan runtime and its UniPC scheduler behavior.
  "diffusers==0.38.0",
  "flash-attn==2.8.3",
  "ftfy>=6.2",
  "omegaconf>=2.3",
  "regex>=2024.0",
  "transformers==5.12.1",
  "peft==0.20.0",
]
h3 = [
  "flash-attn==2.8.3",
  "imageio==2.37.4",
  "imageio-ffmpeg==0.6.0",
]
renderer = [
  "torch>=2.8,<2.9",
  "torchvision>=0.23,<0.24",
  "diffusers==0.40.0",
  "transformers==5.14.1",
  "peft==0.20.0",
  "accelerate>=1.14",
  "safetensors>=0.8",
  "huggingface_hub>=1.25",
  "fsspec>=2024.6",
  "einops>=0.8",
  "numpy>=1.26,<2",
  "av>=13.1",
  "pillow>=11",
  "imageio==2.37.4",
  "imageio-ffmpeg==0.6.0",
]
ltx = [
  # The official ltx_core and ltx_pipelines modules are installed from LTX-2.
  "peft",
  "av",
]
dev = [
  "build>=1.2",
  "decord>=0.6",
  "diffusers==0.38.0",
  "einops>=0.8",
  "ftfy>=6.2",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "regex>=2024.0",
  "ruff>=0.16",
  "safetensors>=0.4",
  "torch>=2.5",
  "transformers>=4.46.2",
]

[project.scripts]
solar = "solar.cli:main"
solarwm = "solar.cli:main"
solar-renderer = "solar.renderer.render:main"

[tool.setuptools]
# Keep example assets in one source location; wheels install them as resources.
package-dir = {"solar" = "solar", "solar.examples" = "examples/solar_wm", "deploy.solar_wm" = "deploy/solar_wm"}
include-package-data = false

[tool.setuptools.package-data]
"solar.renderer" = ["assets/*.json", "assets/*.safetensors"]
"solar.examples" = ["*/first.png", "*/prompt.txt"]
"deploy.solar_wm" = [
  "README.md", "requirements.txt", "*.example.json", "launch.sh",
]
"deploy.solar_wm.solarwm_web" = [
  "static/*.html", "static/*.js", "static/*.png",
  "acceleration/*.json", "media/*.c", "vae/tables/*.json", "vae/tables/*.pt",
]
"solar.backends.wan22.runtime.architectures" = ["*.json"]
"solar.backends.wan22.runtime.modeling" = ["NOTICE.md"]

# flash-attn imports torch from setup.py.  Keep build isolation, but augment the
# isolated build environment with the exact torch selected for the runtime.
[tool.uv.extra-build-dependencies]
flash-attn = [{ requirement = "torch", match-runtime = true }]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers --import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Preserve upstream evaluation prompts, metric descriptions, and math notation.
"eval/solar_renderer/*.py" = ["E501", "E741"]
