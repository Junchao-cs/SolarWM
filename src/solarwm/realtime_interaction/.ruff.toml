# Keep the imported deployment snapshot intact: source digests and compiled
# cache identities depend on its exact bytes. Retain syntax and Pyflakes checks
# here; the rest of SolarWM keeps the repository's full lint policy.
extend = "../../../pyproject.toml"

[lint]
select = ["E9", "F"]

[lint.per-file-ignores]
# Includes deliberate dependency probes and upstream kernel temporaries.
"solarwm_web/__main__.py" = ["F401"]
"solarwm_web/acceleration/operators/refresh_callsite.py" = ["F401"]
"solarwm_web/acceleration/operators/resident.py" = ["F401"]
"solarwm_web/acceleration/operators/rms_fma_kernels.py" = ["F841"]
"solarwm_web/acceleration/operators/rms_fma_refresh_kernels.py" = ["F841"]
"solarwm_web/media/encoder.py" = ["F401"]
"solarwm_web/runtime/scene_math.py" = ["F401"]
"solarwm_web/worker.py" = ["F401"]

[format]
exclude = ["*.py"]
