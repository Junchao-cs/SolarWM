# Offline artifact production through the same injectable online codec protocol.
schema: solarwm.run.v1
action: preencode
name: ltx25-preencode-153f

model:
  family: ltx25_video
  checkpoint_path: /path/to/models/LTX-2.5/diffusion_models/ltx-2.5-22b-dev-transformer-bf16.safetensors
  codec:
    video_vae_path: /path/to/models/LTX-2.5/vae/ltx-2.5-video-vae-bf16.safetensors
    gemma4_path: /path/to/models/LTX-2.5/text_encoders/gemma4-12b-with-proj-ltx-2.5-bf16.safetensors

data:
  input_mode: raw
  format: webdataset
  transport:
    kind: local
    root: /path/to/SolarWM-Data/releases-v1
  index_root: /path/to/SolarWM-Data/releases-v1
  index: recipes/clean-153f/raw-wds/train-index.jsonl.gz
  pixel_frames: 153
  encoded_latents: 20
  height: 512
  width: 768
  latent_channels: 128
  latent_height: 16
  latent_width: 24
  frame_sampling: contiguous
  source_fps_policy: provenance_only
  random_start: false
  seed: 42
  num_workers: 1
  prefetch_factor: 1
  streaming_index: true
  shuffle_buffer: 32
  partition_mode: global_occurrence

preencode:
  codec_protocol: solarwm.ltx25.online_codec.v1
  behavior_status: unpaired
  vae_encode_mode: direct
  automatic_oom_fallback: false
  output_root: /path/to/output/ltx-153f-h512-w768
  samples_per_shard: 32
  index_relative_path: indexes/preencoded.rank-{rank}.jsonl

runtime:
  output_dir: outputs/ltx25-preencode-153f
  provider_entrypoint: solar.backends.ltx25.official:create_provider
