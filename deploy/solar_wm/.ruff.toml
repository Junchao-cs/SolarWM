# Keep the imported deployment snapshot intact: source digests and compiled
# cache identities depend on its exact bytes. Retain syntax and Pyflakes checks
# here; the rest of SolarWM keeps the repository's full lint policy.
extend = "../../pyproject.toml"

[lint]
select = ["E9", "F"]

[lint.per-file-ignores]
# Includes deliberate dependency probes and upstream kernel temporaries.
"backends/standard/__main__.py" = ["F401"]
"backends/memory/__main__.py" = ["F401"]
"backends/standard/acceleration/operators/refresh_callsite.py" = ["F401"]
"backends/standard/acceleration/operators/resident.py" = ["F401"]
"backends/standard/acceleration/operators/rms_fma_kernels.py" = ["F841"]
"backends/standard/acceleration/operators/rms_fma_refresh_kernels.py" = ["F841"]
"shared/media/encoder.py" = ["F401"]
"shared/runtime/scene_math.py" = ["F401"]
"backends/standard/worker.py" = ["F401"]
"backends/standard/acceleration/operators/portable.py" = ["F401"]
"backends/standard/acceleration/operators/schedule.py" = ["F401"]
"backends/standard/runtime/preparation_progress.py" = ["F841"]

[format]
exclude = ["*.py"]
